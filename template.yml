AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: poja-base - Computation and API

Globals:
  Function:
    CodeUri: .
    Runtime: java21
    Tracing: Active
    Architectures:
      - arm64
    EventInvokeConfig:
      MaximumRetryAttempts: 0
    AutoPublishAlias: live
    SnapStart:
      ApplyOn: PublishedVersions
    
    Environment:
      Variables:
        ENV: !Ref Env
        AWS_S3_BUCKET: !Sub '{{resolve:ssm:/poja-base/${Env}/s3/bucket-name}}'
        AWS_SES_SOURCE: lou@hei.school
        
        

Parameters:
  Env:
    Type: String

Resources:
  FrontalFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: com.company.base.handler.LambdaHandler::handleRequest
      MemorySize: 256
      Timeout: 30
      Role: !Sub '{{resolve:ssm:/poja-base/${Env}/execution/role-arn}}'

      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

  ApiUrlSSM:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Join [ '', [ /poja-base/, !Ref Env, /api/url ] ]
      Type: String
      Value: !GetAtt FrontalFunctionUrl.FunctionUrl

Outputs:
  ApiUrl:
    Description: Url to access the frontal function
    Value: !GetAtt FrontalFunctionUrl.FunctionUrl